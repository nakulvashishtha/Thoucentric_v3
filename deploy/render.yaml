# Template for a Render blueprint. Secrets are entered in the Render dashboard (sync: false), never committed.
services:
  - type: web
    name: research-workbench
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free            # switch to "starter" (about 7 USD a month) for the week of the pitch so it never sleeps
    healthCheckPath: /healthz
    envVars:
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: TAVILY_API_KEY, sync: false }
      - { key: ADMIN_PASSCODE, sync: false }
      - { key: MODEL_FAST, sync: false }
      - { key: MODEL_SMART, sync: false }
      - { key: MODE, value: live }
      - { key: DAILY_SPEND_CAP, value: "5" }
      - { key: MAX_LLM_CALLS_PER_CASE, value: "150" }
      - { key: DATA_DIR, value: /app/data }
